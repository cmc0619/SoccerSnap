services:
  soccersnap:
    build: .
    ports:
      - "7420:7420"
    environment:
      SOCCERSNAP_DATA_DIR: /data
      SOCCERSNAP_DATABASE_URL: sqlite:////data/soccersnap.db
      SOCCERSNAP_SECRET_KEY: change-me-in-production
      SOCCERSNAP_OPS_API_KEY: change-me-ops-key
      SOCCERSNAP_DEMO_TEAM_CODE: SNAP26
      SOCCERSNAP_ADMIN_USER: admin
      SOCCERSNAP_ADMIN_PASSWORD: soccersnap
    volumes:
      - soccersnap-data:/data

volumes:
  soccersnap-data:
