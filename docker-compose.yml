services:
  soccersnap:
    build: .
    ports:
      - "127.0.0.1:7420:7420"
    environment:
      SOCCERSNAP_DATA_DIR: /data
      SOCCERSNAP_DATABASE_URL: sqlite:////data/soccersnap.db
      SOCCERSNAP_DEMO_MODE: "false"
      SOCCERSNAP_DEMO_TEAM_CODE: SNAP26
      SOCCERSNAP_ADMIN_USER: admin
      SOCCERSNAP_SECRET_KEY: ${SOCCERSNAP_SECRET_KEY:?set SOCCERSNAP_SECRET_KEY}
      SOCCERSNAP_OPS_API_KEY: ${SOCCERSNAP_OPS_API_KEY:?set SOCCERSNAP_OPS_API_KEY}
      SOCCERSNAP_ADMIN_PASSWORD: ${SOCCERSNAP_ADMIN_PASSWORD:?set SOCCERSNAP_ADMIN_PASSWORD}
    volumes:
      - soccersnap-data:/data

volumes:
  soccersnap-data:
